name = "dee-push"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Estas duas variáveis são SEGREDO — nunca colocar o valor aqui neste
# arquivo (ele pode ir pro Git). Configure com:
#
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT
#     -> cola o CONTEÚDO INTEIRO do arquivo .json da conta de serviço
#        (Firebase Console > Configurações do projeto > Contas de serviço
#        > Gerar nova chave privada)
#
#   wrangler secret put APP_SHARED_SECRET
#     -> cola uma senha longa e aleatória, inventada por você (ex.: gere
#        com `openssl rand -hex 32`). É o "cadeado" que impede qualquer
#        pessoa de usar essa URL pra mandar notificação falsa pro seu app.
#        O MESMO valor precisa estar em public/index.html na constante
#        DEE_PUSH_SHARED_SECRET.
